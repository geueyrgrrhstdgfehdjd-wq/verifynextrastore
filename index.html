<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืนยันตัวตน - Discord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
            position: relative;
        }
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: rgba(34, 197, 94, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            border: 2px solid #22c55e;
        }
        .icon {
            font-size: 40px;
        }
        h1 {
            color: #22c55e;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .user-badge {
            background-color: #0f172a;
            padding: 10px 16px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .username {
            color: #38bdf8;
            font-weight: bold;
        }
        .info-box {
            background-color: rgba(56, 189, 248, 0.1);
            border-left: 4px solid #38bdf8;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .footer-note {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <span class="icon">✅</span>
        </div>
        
        <h1>ยืนยันตัวตนสำเร็จ!</h1>
        
        <p>ยินดีต้อนรับสู่เซิร์ฟเวอร์ ระบบได้ตรวจสอบข้อมูลและมอบยศให้คุณเรียบร้อยแล้ว</p>
        
        <div class="user-badge">
            👤 สมาชิก: <span class="username">@{username}</span>
        </div>

        <div class="info-box">
            📌 <b>หมายเหตุ:</b> ยศของคุณจะแสดงผลใน Discord ภายในไม่กี่วินาที คุณสามารถปิดหน้าต่างนี้ได้ทันที
        </div>

        <p class="footer-note">ขอบคุณที่ทำการยืนยันตัวตนเพื่อความปลอดภัยของเซิร์ฟเวอร์</p>
    </div>

</body>
</html>
